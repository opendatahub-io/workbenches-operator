# Syncs commits from a source branch into a target branch (e.g. main -> stable).
# Adapted from https://github.com/opendatahub-io/kubeflow/blob/main/.github/workflows/sync-branches.yaml
name: Sync Branches

on:
  workflow_dispatch:
    inputs:
      source:
        description: "From:"
        required: true
        type: string
      target:
        description: "To:"
        required: true
        type: string
  workflow_call:
    inputs:
      source:
        description: "From:"
        required: true
        type: string
      target:
        description: "To:"
        required: true
        type: string
    outputs:
      pushed:
        description: "Whether this run pushed a new tip to the target branch"
        value: ${{ jobs.sync-branches.outputs.pushed }}

permissions: {}

env:
  SOURCE_BRANCH: ${{ inputs.source }}
  TARGET_BRANCH: ${{ inputs.target }}

jobs:
  sync-branches:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      pushed: ${{ steps.merge.outputs.pushed }}

    steps:
    - name: Set up Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Merge source branch into target
      id: merge
      run: |
        set -e
        echo "pushed=false" >> "$GITHUB_OUTPUT"

        # Caller must prepare the target branch before invoking this workflow
        # (e.g. reset sync/main-to-stable from stable for the PR flow).
        git fetch origin "$TARGET_BRANCH:$TARGET_BRANCH"
        git checkout "$TARGET_BRANCH"

        # Save the target commit before merging so all protected-path restores
        # reference it explicitly.
        TARGET_COMMIT=$(git rev-parse HEAD)

        # Fetch and merge source branch
        git fetch origin "$SOURCE_BRANCH:$SOURCE_BRANCH"
        merge_status=0
        git merge --no-commit "origin/$SOURCE_BRANCH" || merge_status=$?
        # A non-zero exit is acceptable only when Git entered a conflict state
        # (MERGE_HEAD present).  Any other failure (e.g. unrelated histories) is fatal.
        if [[ "$merge_status" -ne 0 ]] && ! git rev-parse --verify MERGE_HEAD >/dev/null 2>&1; then
          echo "Merge failed without entering a conflict state (exit $merge_status)."
          exit "$merge_status"
        fi

        #########################################################################
        # Always keep target branch state for .tekton, opt/manifests, and
        # opt/manifest-sources.sh (do not propagate those from source).
        # That keeps operand refs/pins branch-specific:
        #   main → stable  does not replace stable@sha with main's unpinned refs
        #   stable → v1.x  does not replace v1.x tag pins with stable@sha
        # get_all_manifests.sh still merges from source so fetch-script fixes
        # propagate. Caveats:
        # - This applies to any source/target pair using this workflow.
        # - If target does not contain a guarded directory, any merged content
        #   from source will be removed.
        # - This guard exists only in this workflow; manual merges can still
        #   propagate these paths unless handled similarly.

        for DIR in .tekton opt/manifests; do
          git rm -r -f --cached --ignore-unmatch -- ":/${DIR}"
          rm -rf -- "$(git rev-parse --show-toplevel)/${DIR}"

          if git rev-parse --verify "${TARGET_COMMIT}:${DIR}" >/dev/null 2>&1; then
            echo "Keeping target branch version of ${DIR}."
            git checkout "$TARGET_COMMIT" -- ":/${DIR}"
            git add -A -- ":/${DIR}"
          fi
        done

        # Keep the target operand source map so branch sync does not replace
        # pins. get_all_manifests.sh still merges from source (script fixes
        # propagate). If the target does not have this file yet, abort rather
        # than taking the source-branch maps — add opt/manifest-sources.sh on
        # stable/v1.x first (with that branch's pins).
        SOURCES_FILE="opt/manifest-sources.sh"
        git rm -f --ignore-unmatch -- "${SOURCES_FILE}"
        if git rev-parse --verify "${TARGET_COMMIT}:${SOURCES_FILE}" >/dev/null 2>&1; then
          echo "Keeping target branch version of ${SOURCES_FILE}."
          git checkout "$TARGET_COMMIT" -- "${SOURCES_FILE}"
          git add -- "${SOURCES_FILE}"
        else
          echo "ERROR: ${TARGET_BRANCH} has no ${SOURCES_FILE}; refusing to copy it from ${SOURCE_BRANCH}."
          echo "Add that file on ${TARGET_BRANCH} with this branch's pins before running sync-branches."
          exit 1
        fi
        #########################################################################

        # Known files to resolve by keeping the target branch version
        # (typically branch-specific image tags / params).
        FILES=(
          "charts/operator/params.env"
        )
        for FILE in "${FILES[@]}"; do
          if git cat-file -e "${TARGET_COMMIT}:${FILE}" 2>/dev/null; then
            echo "Keeping target branch version of $FILE."
            git checkout "$TARGET_COMMIT" -- "$FILE"
            git add "$FILE"
          fi
        done

        # Check for potential unresolved conflicts
        if [[ -n "$(git ls-files -u)" ]]; then
          echo "Unresolved conflicts detected in the following files:"
          git ls-files -u
          echo "Aborting merge due to unexpected conflicts."
          exit 1
        fi

        # Commit changes if any.
        MERGED_COMMIT=$(git rev-parse HEAD)
        if [[ -n "$(git status --porcelain)" ]]; then
          git commit -m "Merge $SOURCE_BRANCH into $TARGET_BRANCH with known resolved conflicts"
          MERGED_COMMIT=$(git rev-parse HEAD)
        fi

        # Skip push when the merged result is identical to the starting target commit.
        # This can happen when every incoming change affected only protected files.
        if [[ "$MERGED_COMMIT" = "$TARGET_COMMIT" ]]; then
          echo "Merged result is identical to target. Nothing to push."
          exit 0
        fi

        git push origin "$TARGET_BRANCH"
        echo "pushed=true" >> "$GITHUB_OUTPUT"
