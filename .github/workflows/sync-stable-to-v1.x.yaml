name: Sync stable → v1.x (PR)

on:
  schedule:
    # Offset from main→stable (06:00) so the stream hop usually lands first.
    - cron: "0 8 * * *"  # 08:00 UTC daily
  workflow_dispatch: {}

permissions: {}

jobs:
  sync:
    uses: ./.github/workflows/sync-via-pr.yaml
    secrets:
      GHA_SECRET_PAT: ${{ secrets.GHA_SECRET_PAT }}
    permissions:
      contents: write
    with:
      source: stable
      target: v1.x
      merge_branch: sync/stable-to-v1.x
      pr_title: "chore: sync stable → v1.x"
      pr_body: |
        Automated daily sync of `stable` into `v1.x`.

        **What this PR does**
        - Merges all commits from `stable` that are not yet in `v1.x`.
        - Keeps the `v1.x` version of `.tekton/`, `opt/manifests/`, `opt/manifest-sources.sh`, and known version-pinned files.

        **Review checklist**
        - [ ] Diff looks as expected (no unintended version bumps or config changes)
        - [ ] CI is green

        > Generated by the *Sync stable → v1.x (PR)* workflow.
